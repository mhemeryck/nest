schema: spec-driven

context: |
  Nest is a Go 1.26 home automation controller for Unipi hardware.
  Runtime integrations include sysfs, MQTT, Home Assistant discovery, and Modbus RTU.
  Follow AGENTS.md for code, architecture, testing, Git, and writing conventions.
  Keep parsed configuration, domain entities, runtime registries, and integration types separate.
  Controllers own semantic behavior; actors own external protocol details.
  Local hardware control must operate independently of MQTT and Home Assistant connectivity.
  Use the pinned devenv environment; run nest-check for lint, vet, race tests, and builds.
  Use testify assertions in Go tests.
  docs/ contains architecture, hardware mappings, migration context, and the implementation roadmap.
  openspec/specs/ records accepted behavior from completed changes.
  openspec/changes/ contains proposed behavior and implementation tasks for active changes.
  Develop requirements collaboratively, one focused behavior at a time.
  Treat existing documents and code as evidence, not automatically accepted requirements.
  The cover plan at commit 14bf97a855d52cac134fdc5af227395fe50d6b86 is discussion context.
  Distinguish observed behavior, agreed requirements, assumptions, and unresolved questions.

rules:
  proposal:
    - Keep the scope small enough for a verifiable increment.
    - Resolve material behavior and scope questions with the user before drafting requirements.
  specs:
    - Write specs in ASD-STE100 Simplified Technical English; use active voice, consistent terms, and one idea per sentence.
    - Capture agreed behavior with concrete scenarios, including relevant failure cases.
    - Do not convert historical plans wholesale or present pending behavior as implemented.
  design:
    - Record unresolved questions and tradeoffs explicitly.
    - Preserve existing package boundaries unless a concrete dependency issue requires a change.
  tasks:
    - Group tasks into small, verifiable increments.
    - Include relevant scenario tests and nest-check before completion.

operations:
  apply:
    guidance:
      - Discuss new material behavior questions before choosing an implementation.
      - Update artifacts when implementation evidence changes the agreed approach.
  archive:
    guidance:
      - Verify delivered behavior against the agreed scenarios before archiving.
