actors:
  mqtt:
    broker:
      enabled: true
      host: localhost
      port: 1883
      client_id: nest-local
      topic_prefix: nest

units:
  local:
    actors:
      mqtt:
        enabled: true
      sysfs:
        root: test/fixtures
        poll_intervals:
          digital_input: 100ms
          digital_output: 250ms
          relay_output: 1s
        digital_inputs:
          - id: office_button_input
            device: di_3_16
          - id: hallway_button_input
            device: di_3_15
        relays:
          - id: office_light_relay
            name: Office light relay
            device: ro_3_14
          - id: hallway_light_relay
            name: Hallway light relay
            device: ro_3_13
    entities:
      buttons:
        - id: office_button
          name: Office light button
          input:
            actor: sysfs
            kind: digital_input
            id: office_button_input
        - id: hallway_button
          name: Hallway light button
          input:
            actor: sysfs
            kind: digital_input
            id: hallway_button_input
      lights:
        - id: office_light
          name: Office light
          actuator:
            actor: sysfs
            kind: relay
            id: office_light_relay
        - id: hallway_light
          name: Hallway light
          actuator:
            actor: sysfs
            kind: relay
            id: hallway_light_relay

bindings:
  - source: local.button.office_button
    target: local.light.office_light
    action: toggle
  - source: local.button.hallway_button
    target: local.light.hallway_light
    action: toggle
